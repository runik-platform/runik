apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: example-book
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/runik-platform/runik.git
    targetRevision: upstream
    path: librarian
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    retry:
      limit: 2
    syncOptions:
      - CreateNamespace=true
